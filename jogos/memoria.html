<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memória | GameCenter</title><link rel="stylesheet" href="base.css"></head><body><main class="game"><a class="back" href="../index.html?view=home">← Voltar ao GameCenter</a><h1>🧠 Jogo da Memória</h1><p class="sub">Memorize as cartas e encontre os pares.</p><div id="b" class="board" style="grid-template-columns:repeat(4,clamp(58px,17vw,82px))"></div><p id="s" class="status"></p><button class="btn" onclick="newGame()">Novo jogo</button><p class="hint">Movimentos: <span id="m">0</span></p></main><script>const icons=['🎮','🚀','🐱','⚽','🎵','🌟','🎮','🚀','🐱','⚽','🎵','🌟'];let first=null,lock=false,matches=0,moves=0;function newGame(){first=null;lock=false;matches=moves=0;let a=[...icons].sort(()=>Math.random()-.5);b.innerHTML=a.map(v=>`<button class="card" data-v="${v}" onclick="flip(this)">?</button>`).join('');s.textContent='Pares: 0/6';m.textContent=0}function flip(el){if(lock||el===first||el.classList.contains('open'))return;el.textContent=el.dataset.v;el.classList.add('open');if(!first){first=el;return}moves++;m.textContent=moves;if(first.dataset.v===el.dataset.v){matches++;first=null;s.textContent=`Pares: ${matches}/6`;if(matches===6)s.textContent=`🏆 Você venceu em ${moves} movimentos!`}else{lock=true;setTimeout(()=>{first.textContent=el.textContent='?';first.classList.remove('open');el.classList.remove('open');first=null;lock=false},650)}}newGame()</script></body></html>
