<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogo da Velha | GameCenter</title><link rel="stylesheet" href="base.css"></head><body><main class="game"><a class="back" href="../index.html?view=home">← Voltar ao GameCenter</a><h1>⭕ Jogo da Velha</h1><p class="sub">Você é X. Vença o computador em três linhas.</p><div id="b" class="board" style="grid-template-columns:repeat(3,clamp(68px,20vw,96px))"></div><p id="s" class="status"></p><button class="btn" onclick="newGame()">Nova partida</button><p class="hint">Dica: tente ocupar o centro primeiro.</p></main><script>let a,over;const b=document.getElementById('b'),s=document.getElementById('s'),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function newGame(){a=Array(9).fill('');over=false;s.textContent='Sua vez';b.innerHTML=a.map((_,i)=>`<button class="card" onclick="play(${i})"></button>`).join('')}function win(p){return wins.some(r=>r.every(i=>a[i]===p))}function finish(t){over=true;s.textContent=t}function play(i){if(over||a[i])return;a[i]='X';render();if(win('X')||!a.includes(''))return finish(win('X')?'🎉 Você venceu!':'Empate!');let empty=a.map((v,j)=>v?null:j).filter(v=>v!==null),j=empty.includes(4)&&Math.random()<.6?4:empty[Math.random()*empty.length|0];setTimeout(()=>{a[j]='O';render();if(win('O')||!a.includes(''))finish(win('O')?'O computador venceu!':'Empate!');else s.textContent='Sua vez'},260)}function render(){[...b.children].forEach((el,i)=>{el.textContent=a[i];el.classList.toggle('open',!!a[i])})}newGame()</script></body></html>
