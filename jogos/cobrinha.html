<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cobrinha | GameCenter</title><link rel="stylesheet" href="base.css"></head><body><main class="game"><a class="back" href="../index.html?view=home">← Voltar ao GameCenter</a><h1>🐍 Cobrinha</h1><p class="sub">Coma as frutas, cresça e bata seu recorde.</p><canvas id="c" width="360" height="360"></canvas><p id="s" class="status"></p><button class="btn" onclick="start()">Reiniciar partida</button><p class="hint">Setas/WASD · Espaço pausa · Toque nos botões do celular</p><div><button class="btn" onclick="move(0,-1)">↑</button><button class="btn" onclick="move(-1,0)">←</button><button class="btn" onclick="move(1,0)">→</button><button class="btn" onclick="move(0,1)">↓</button></div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=18;let snake,food,dir,next,score,timer,paused,over;function start(){snake=[{x:9,y:9},{x:8,y:9}];food={x:4,y:5};dir=next={x:1,y:0};score=0;paused=false;over=false;clearInterval(timer);timer=setInterval(tick,110);draw()}function move(a,b){if(a!==-dir.x||b!==-dir.y)next={x:a,y:b}}function tick(){if(paused||over)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y)){over=true;clearInterval(timer);draw();return}snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x==food.x&&p.y==food.y))}else snake.pop();draw()}function draw(){x.fillStyle='#101827';x.fillRect(0,0,360,360);x.fillStyle='#ef6b83';x.fillRect(food.x*20+3,food.y*20+3,14,14);snake.forEach((p,i)=>{x.fillStyle=i?'#36d69a':'#b5f7d8';x.fillRect(p.x*20+2,p.y*20+2,16,16)});document.getElementById('s').textContent=over?'Fim de jogo! Pontuação: '+score+' · clique em reiniciar':'Pontuação: '+score+(paused?' · pausado':'')}addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(d)move(...d);if(e.code==='Space'){paused=!paused;draw()}});start()</script></body></html>
