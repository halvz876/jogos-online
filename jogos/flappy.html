<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Bird | GameCenter</title><link rel="stylesheet" href="base.css"></head><body><main class="game"><a class="back" href="../index.html?view=home">← Voltar ao GameCenter</a><h1>🐦 Flappy Bird</h1><p class="sub">Passe pelos canos e alcance a maior pontuação.</p><canvas id="c" width="360" height="480"></canvas><p id="s" class="status">Pontuação: 0 · Recorde: 0</p><button class="btn" onclick="start()">Começar / reiniciar</button><p class="hint">Clique, toque ou pressione Espaço para voar.</p></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),bestKey='flappyBest';let y,v,pipe,score,run,best=+localStorage.getItem(bestKey)||0;function start(){y=220;v=0;pipe={x:360,g:165,passed:false};score=0;run=true;loop()}function flap(){if(run)v=-7;else start()}addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});c.onclick=flap;function loop(){if(!run)return;v+=.38;y+=v;pipe.x-=2.7;if(pipe.x<-60){pipe={x:360,g:90+Math.random()*240,passed:false}}if(!pipe.passed&&pipe.x<65){score++;pipe.passed=true}let hit=y<0||y>464||(pipe.x<82&&pipe.x+60>40&&(y<pipe.g-72||y>pipe.g+72));if(hit){run=false;if(score>best){best=score;localStorage.setItem(bestKey,best)}draw();s.textContent=`Fim de jogo · ${score} pontos · Recorde: ${best}`;return}draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,360,480);x.fillStyle='#60a5fa';x.fillRect(0,0,360,480);x.fillStyle='#22c55e';x.fillRect(pipe.x,0,60,pipe.g-72);x.fillRect(pipe.x,pipe.g+72,60,480);x.fillStyle='#facc15';x.beginPath();x.arc(65,y,16,0,7);x.fill();x.fillStyle='#172554';x.font='bold 24px system-ui';x.fillText(score,18,38);s.textContent=`Pontuação: ${score} · Recorde: ${best}`}start()</script></body></html>
